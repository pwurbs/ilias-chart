images:
  ilias:
    repository: srsolutions/ilias
    tag: 11.4-php8.4-apache
    pullPolicy: IfNotPresent
  mariadb:
    repository: mariadb
    tag: "12.3.3"
    pullPolicy: IfNotPresent
  ilserver:
    # ILIAS Java server for certificate/PDF generation
    repository: srsolutions/ilias-ilserver
    tag: 11-openjdk21-jre
    pullPolicy: IfNotPresent

ilias:
  httpPath: ""         # e.g. https://ilias.example.com — set in your own values override file
  timezone: Europe/Berlin
  maxUploadSize: 5000M
  autoSetup: "0" # Safe default. Set to "1" temporarily for the initial install or an ILIAS update, in your own values override file

secrets:
  # existingSecret: if set, name of an already existing Secret — for setups where the
  # Secret is created and managed outside of this chart from the start (e.g. SOPS, External
  # Secrets Operator). If left empty, the chart generates these three passwords itself on
  # first install — no cleartext password ever needs to be set as a value — and keeps
  # reusing the live values (verbatim, still base64, never decoded) on every subsequent
  # render, so rotating them directly in the cluster is safe. If a Flux HelmRelease drives
  # this chart with driftDetection enabled, add an `ignore` rule for this Secret's `/data`
  # path — see README > Secrets > Rotation — so Flux doesn't race a manual rotation against
  # its own drift correction.
  existingSecret: ""
  # Only relevant when existingSecret is set: key names inside that Secret, in case it doesn't
  # use the chart's own default key names.
  existingSecretKeys:
    iliasRootPassword: ""    # default: ilias-root-password
    iliasDbPassword: ""      # default: ilias-db-password
    mariadbRootPassword: ""  # default: mariadb-root-password

branding:
  # Optional custom branding (header icons + CSS override)
  # Items are injected via the values below
  enabled: false
  # Literal SVG markup (the file content itself — not a file path, not base64) for
  # HeaderIcon.svg / HeaderIconResponsive.svg, replaces the ILIAS default icons. Set it as
  # an inline block scalar in a values file, or via `helm install --set-file
  # branding.headerIconSvg=./HeaderIcon.svg`.
  headerIconSvg: ""
  headerIconResponsiveSvg: ""
  # CSS appended to the ILIAS default delos.css
  css: ""

ilserver:
  # The ILIAS Java server is only needed for certificate/PDF generation. When false,
  # neither the Deployment nor the Service is rendered.
  enabled: true

cron:
  # How often ILIAS's own job queue (notifications, cleanup, indexing, ...) is run.
  # Matches the vendor image's original */10 default.
  schedule: "*/10 * * * *"
  # ILIAS user name `cli/cron.php run-jobs` impersonates. Must be a user with
  # auth_mode=local and active=1 (see README) — but needs no RBAC role/permissions. Defaults to
  # the built-in "root" superadmin for out-of-the-box compatibility; switching to a dedicated,
  # permission-less account (see README, "Cron technical user") is a deliberate per-deployment
  # hardening decision.
  user: "root"
  # ILIAS client ID. The vendor image only runs a single client named "default".
  clientId: "default"

mariadb:
  database: ilias
  user: ilias

ingress:
  host: ""             # e.g. ilias.example.com — set in your own values override file
  tls:
    enabled: true
    secretName: ""     # empty = ingress controller's default certificate; with cert-manager: name of the TLS Secret

reverseProxy:
  # Enables Apache mod_remoteip so ILIAS sees the real client IP behind a reverse proxy — see
  # README, "Reverse Proxy Client IP".
  enabled: false
  # CIDRs/IPs trusted to set X-Forwarded-For. Required when enabled is true.
  trustedIPs: []

storage:
  storageClass: local-path   # k3s's built-in default StorageClass — override for other distributions/cloud providers
  mariadb:
    size: 5Gi
  iliasPublic:
    size: 5Gi
  iliasData:
    size: 50Gi

resources:
  init:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  ilias:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi
  cron:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  mariadb:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 1Gi
  ilserver:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 500Mi
