{{- if not .Values.secrets.existingSecret }}
{{- $secretName := printf "%s-secrets" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $iliasRootPassword := randAlphaNum 32 }}
{{- $iliasDbPassword := randAlphaNum 32 }}
{{- $mariadbRootPassword := randAlphaNum 32 }}
{{- if $existing }}
{{- $iliasRootPassword = index $existing.data "ilias-root-password" | b64dec }}
{{- $iliasDbPassword = index $existing.data "ilias-db-password" | b64dec }}
{{- $mariadbRootPassword = index $existing.data "mariadb-root-password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  ilias-root-password: {{ $iliasRootPassword | quote }}
  ilias-db-password: {{ $iliasDbPassword | quote }}
  mariadb-root-password: {{ $mariadbRootPassword | quote }}
{{- end }}
